[PHP]

; Decides whether PHP may expose the fact that it is installed on the server
; (e.g. by adding its signature to the Web server header).  It is no security
; threat in any way, but it makes it possible to determine whether you use PHP
; on your server or not.
; https://php.net/expose-php
expose_php = Off

[Session]

; PHP 8.6 made these three the built-in defaults. They are set here so that the
; 8.5 image behaves the same as the 8.6 image, which needs no setting for them.
; https://php.net/session.configuration

; Reject session IDs the server did not issue, and issue a new one instead.
; Protects against session fixation.
; https://php.net/session.use-strict-mode
session.use_strict_mode = 1

; Keep the session cookie out of reach of JavaScript.
; https://php.net/session.cookie-httponly
session.cookie_httponly = 1

; Send the session cookie on same-site requests and on top-level GET
; navigations from other sites, but not on cross-site POSTs or embeds.
; https://php.net/session.cookie-samesite
session.cookie_samesite = "Lax"
