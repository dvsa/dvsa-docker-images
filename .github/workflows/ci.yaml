name: CI

on:
  pull_request:

permissions:
  contents: read

jobs:
  orchestrator:
    name: Orchestrator
    runs-on: ubuntu-latest
    outputs:
      changed-directories: ${{ steps.changed-directories.outputs.all_changed_and_modified_files_count > 0 && steps.changed-directories.outputs.all_changed_files || null }}
      # A workflow change affects every image, so build them all.
      workflows-changed: ${{ steps.workflows.outputs.any_changed }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: tj-actions/changed-files@v47
        id: changed-directories
        with:
          files_ignore: |
            .github/**
            *
          dir_names: true
      - uses: tj-actions/changed-files@v47
        id: workflows
        with:
          files: .github/workflows/**

  docker:
    name: Docker
    if: ${{ needs.orchestrator.outputs.changed-directories || needs.orchestrator.outputs.workflows-changed == 'true' }}
    needs:
      - orchestrator
    strategy:
      fail-fast: false
      matrix:
        base:
          - php/8.2/fpm-nginx
          - php/8.2/fpm-apache
          - php/8.3/fpm-nginx
          - php/8.4/fpm-nginx
          - php/8.5/fpm-nginx
          - php/8.2/cli
          - php/8.3/cli
          - php/8.4/cli
          - php/8.5/cli
          - squid/6.12
          - squid/7
          - java/8/amazoncorretto
          - java/25/amazoncorretto
        exclude:
          - base: ${{ needs.orchestrator.outputs.workflows-changed == 'true' || contains(needs.orchestrator.outputs.changed-directories, 'php/8.2/fpm-nginx') && 'ignored' || 'php/8.2/fpm-nginx' }}
          - base: ${{ needs.orchestrator.outputs.workflows-changed == 'true' || contains(needs.orchestrator.outputs.changed-directories, 'php/8.2/fpm-apache') && 'ignored' || 'php/8.2/fpm-apache' }}
          - base: ${{ needs.orchestrator.outputs.workflows-changed == 'true' || contains(needs.orchestrator.outputs.changed-directories, 'php/8.3/fpm-nginx') && 'ignored' || 'php/8.3/fpm-nginx' }}
          - base: ${{ needs.orchestrator.outputs.workflows-changed == 'true' || contains(needs.orchestrator.outputs.changed-directories, 'php/8.4/fpm-nginx') && 'ignored' || 'php/8.4/fpm-nginx' }}
          - base: ${{ needs.orchestrator.outputs.workflows-changed == 'true' || contains(needs.orchestrator.outputs.changed-directories, 'php/8.5/fpm-nginx') && 'ignored' || 'php/8.5/fpm-nginx' }}
          - base: ${{ needs.orchestrator.outputs.workflows-changed == 'true' || contains(needs.orchestrator.outputs.changed-directories, 'php/8.2/cli') && 'ignored' || 'php/8.2/cli' }}
          - base: ${{ needs.orchestrator.outputs.workflows-changed == 'true' || contains(needs.orchestrator.outputs.changed-directories, 'php/8.3/cli') && 'ignored' || 'php/8.3/cli' }}
          - base: ${{ needs.orchestrator.outputs.workflows-changed == 'true' || contains(needs.orchestrator.outputs.changed-directories, 'php/8.4/cli') && 'ignored' || 'php/8.4/cli' }}
          - base: ${{ needs.orchestrator.outputs.workflows-changed == 'true' || contains(needs.orchestrator.outputs.changed-directories, 'php/8.5/cli') && 'ignored' || 'php/8.5/cli' }}
          - base: ${{ needs.orchestrator.outputs.workflows-changed == 'true' || contains(needs.orchestrator.outputs.changed-directories, 'squid/6.12') && 'ignored' || 'squid/6.12' }}
          - base: ${{ needs.orchestrator.outputs.workflows-changed == 'true' || contains(needs.orchestrator.outputs.changed-directories, 'squid/7') && 'ignored' || 'squid/7' }}
          - base: ${{ needs.orchestrator.outputs.workflows-changed == 'true' || contains(needs.orchestrator.outputs.changed-directories, 'java/8/amazoncorretto') && 'ignored' || 'java/8/amazoncorretto' }}
          - base: ${{ needs.orchestrator.outputs.workflows-changed == 'true' || contains(needs.orchestrator.outputs.changed-directories, 'java/25/amazoncorretto') && 'ignored' || 'java/25/amazoncorretto' }}
    uses: ./.github/workflows/docker.yaml
    with:
      image-version: ${{ github.event.pull_request.head.sha }}
      dockerfile-directory: ${{ matrix.base }}
      repository: ${{ matrix.base }}
    permissions:
      contents: read
      id-token: write
      packages: write
      security-events: write
